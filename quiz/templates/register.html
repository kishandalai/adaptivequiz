{% extends 'base.html' %}

{% block title %}AdaptiveQuiz | Register{% endblock %}

{% block content %}
<section class="auth-page container">
    <div class="form-box auth-card">
        <p class="eyebrow">Get started</p>
        <h2>Create your account</h2>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary full-width">Register</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</section>
{% endblock %}
