{% extends 'admin/base.html' %}
{% block content %}<div class="page-header"><div><p class="eyebrow">Knowledge library</p><h1>{{ heading }}</h1></div></div><form method="post" class="card admin-panel">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="admin-form-row">{{ field.label_tag }}{{ field }}{% if field.help_text %}<div class="admin-help">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary" type="submit">Save Note</button> <a class="btn btn-secondary" href="{% url 'admin_notes' %}">Cancel</a></form>{% endblock %}
